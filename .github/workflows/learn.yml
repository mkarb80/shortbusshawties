name: Daily learn and refill
# Runs hourly but only does work at 10am Pacific, once per day (same trick as the poster, so DST never matters).
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now regardless of the 10am gate"
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-post
  cancel-in-progress: false
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0
      - name: Analyze, learn, refill queue, post readout
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: python scripts/learn.py
